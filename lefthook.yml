pre-commit:
  jobs:
    - name: format staged files
      run: pnpm exec biome check --write --no-errors-on-unmatched {staged_files}
      glob: '*.{ts,js,mjs,cjs,json}'
      stage_fixed: true
    - name: format staged docs
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      glob: '*.{yaml,yml,md}'
      stage_fixed: true
